<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #000000;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background-color: #1c287c;
            color: #ffffff;
            text-align: center;
            padding: 20px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        main {
            width: 70%;
            margin: 25px auto;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        /* Accessible Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 14px;
        }

        caption {
            font-weight: bold;
            margin-bottom: 6px;
            color: #333333;
        }

        th, td {
            border: 1px solid #999999;
            padding: 6px 8px;
            text-align: left;
        }

        th {
            background-color: #e6e6e6;
            text-align: center;
            font-weight: bold;
        }

        /* Accessible Form Styling */
        fieldset {
            border: 1px solid #999999;
            padding: 15px;
        }

        legend {
            padding: 0 5px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="email"] {
            width: 240px;
            padding: 4px;
            border: 1px solid #767676;
            border-radius: 2px;
        }

        select {
            padding: 3px 6px;
            border: 1px solid #767676;
            border-radius: 3px;
            background-color: #f0f0f0;
        }

        textarea {
            width: 420px;
            max-width: 100%;
            height: 45px;
            padding: 4px;
            border: 1px solid #767676;
            border-radius: 2px;
        }

        button {
            padding: 4px 10px;
            border: 1px solid #767676;
            border-radius: 3px;
            background-color: #f0f0f0;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        footer {
            background-color: #1c287c;
            color: #ffffff;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ABC College Admission 2026</h1>
        </header>
        <main>
            <section aria-labelledby="courses-heading">
                <h2 id="courses-heading">Courses and Fees</h2>
                
                <table>
                    <caption>Available Courses</caption>
                    <thead>
                        <tr>
                            <th scope="col">Course</th>
                            <th scope="col">Seats</th>
                            <th scope="col">Fees</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>B.Tech CSE</td>
                            <td>120</td>
                            <td>&#8377;90,000</td>
                        </tr>
                        <tr>
                            <td>BCA</td>
                            <td>60</td>
                            <td>&#8377;45,000</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <section aria-label="Student Application Form">
                <form action="#" method="post">
                    <fieldset>
                        <legend>Application Form</legend>

                        <div class="form-group">
                            <label for="student-name">Name:</label>
                            <input type="text" id="student-name" name="student-name" required minlength="2">
                        </div>

                        <div class="form-group">
                            <label for="student-email">Email:</label>
                            <input type="email" id="student-email" name="student-email" required>
                        </div>

                        <div class="form-group">
                            <label for="course-select">Course:</label>
                            <select id="course-select" name="course" required>
                                <option value="btech-cse" selected>B.Tech CSE</option>
                                <option value="bca">BCA</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="statement">Statement:</label>
                            <textarea id="statement" name="statement" required minlength="10"></textarea>
                        </div>

                        <button type="submit">Apply</button>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer>
            &copy; 2026 ABC College
        </footer>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 12 - Student Marks Table</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: "Times New Roman", Times, serif;
        }
        th, td {
            border: 1px solid black;
            padding: 4px 8px;
            text-align: left;
        }
        caption {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Student Marks</caption>
        <thead>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Average</td>
                <td>88.5</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
